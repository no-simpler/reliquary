[package]
name = "midden"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Machine-wide friction corpus: what the harness cost an agent, filed as it happened."
license = "MIT"
publish = false

[[bin]]
name = "midden"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
comfy-table = "8.0.0"
getrandom = "0.4.3"
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
supports-color = "3.0.2"

# Integration tests are their own crate, so what the binary depends on is not
# in scope for them.
[dev-dependencies]
jiff = "0.2.35"
serde_json = "1.0.151"
