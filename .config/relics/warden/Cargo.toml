[package]
name = "warden"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library plus a thin binary. The guard is the library so the thing that
# invokes it can change — today a yadm hook, tomorrow an ordinary git hook or a
# station inside an aggregator — without the logic moving.
[lib]
name = "warden"
path = "src/lib.rs"

[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
fs-err.workspace = true
regex = "1.13.1"
serde.workspace = true
thiserror.workspace = true
toml = "1.1.4"
relic-core = { path = "../crates/relic-core" }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
