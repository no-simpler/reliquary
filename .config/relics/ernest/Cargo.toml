[package]
name = "ernest"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Measure prose density — the share of a codebase's text that is prose rather than code."
license = "MIT"
publish = false

[lib]
name = "ernest"
path = "src/lib.rs"

[[bin]]
name = "ernest"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.30"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter = "0.26.12"
tree-sitter-language = "0.1.7"
tree-sitter-md = "0.5.3"
tree-sitter-php = "0.24.2"
tree-sitter-yaml = "0.7.2"
