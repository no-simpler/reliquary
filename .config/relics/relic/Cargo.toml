[package]
name = "relic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "relic"
path = "src/lib.rs"

[[bin]]
name = "relic"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
fs-err.workspace = true
relic-core = { path = "../crates/relic-core" }
serde.workspace = true
thiserror.workspace = true
# Two relics already declare this version directly; the manifest, the two
# ratchets and the workspace member list are all TOML this reads or edits.
toml = "1.1.4"
# The suppression ratchet walks a package's sources; `decruft`, `ernest` and
# `assay` already walk with this one.
ignore = "0.4.25"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
which.workspace = true

[lints]
workspace = true
