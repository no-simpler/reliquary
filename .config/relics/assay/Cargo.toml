[package]
name = "assay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library plus a thin binary. The stations and the runner are the library, so
# an aggregator, a hook or another relic can hold them without going through a
# process boundary.
[lib]
name = "assay"
path = "src/lib.rs"

[[bin]]
name = "assay"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
fs-err.workspace = true
globset = "0.4.19"
ignore = "0.4.25"
regex = "1.13.1"
toml = "1.1.4"
serde.workspace = true
serde_json.workspace = true
relic-core = { path = "../crates/relic-core" }
# The identity guard, as a library. `warden` owns the definition and the test;
# a second implementation of either is how two consumers of one definition come
# to disagree, which is the defect this station exists to catch elsewhere.
warden = { path = "../warden" }

[dev-dependencies]
assert_cmd.workspace = true
serde_json.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
