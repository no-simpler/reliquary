# The relic lane's cargo workspace.
#
# Members are named explicitly, not globbed: the lane holds relics of every
# runtime, and `members` is the whitelist that keeps the non-compiled ones
# invisible to cargo — the same discipline yadm applies to $HOME. Relics are
# Rust by default (see ~/.config/reliquary/GRADUATION.md), so this list grows
# with the lane; `relic scaffold` appends to it.
#
# `crates/*` is the shared-library boundary. A crate there is depended on by
# path from the relics that need it and is a workspace member in its own right,
# which is the whole reason for a workspace rather than a bare path dependency:
# a member is covered by `cargo fmt --all`, `cargo clippy --workspace` and
# `cargo test --workspace`, while a path dependency outside one is compiled as a
# dependency and linted by nothing.
#
# Attic relics must never be listed here. A member's name and version land in
# Cargo.lock, which is tracked publicly.

[workspace]
resolver = "3"
members = [
    "crates/*",
    "docket",
    "ernest",
    "midden",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

# Every dependency two or more members share. A member's own dependencies stay
# in its own manifest — hoisting a single-consumer crate here would claim a
# shared version policy that does not exist.
[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
comfy-table = "8.0.0"
getrandom = "0.4.3"
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
supports-color = "3.0.2"

# Profiles are workspace-wide by construction: cargo ignores a member's own
# [profile] block. All three relics declared the same release profile anyway.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Full DWARF was 88% of this lane's disk (3.26 GB of 3.7 GB, almost all of it
# under target/debug from test and clippy runs). Line tables keep backtraces
# readable, which is the only thing debuginfo is for in a CLI relic.
[profile.dev]
debug = "line-tables-only"
