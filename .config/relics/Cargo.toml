# The relic lane's cargo workspace.
#
# Members are named explicitly, not globbed: the lane holds relics of every
# runtime, and `members` is the whitelist that keeps the non-compiled ones
# invisible to cargo — the same discipline yadm applies to $HOME. Relics are
# Rust by default (see ~/.config/reliquary/GRADUATION.md), so this list grows
# with the lane; `relic scaffold` appends to it.
#
# `crates/*` is the shared-library boundary. A crate there is depended on by
# path from the relics that need it and is a workspace member in its own right,
# which is the whole reason for a workspace rather than a bare path dependency:
# a member is covered by `cargo fmt --all`, `cargo clippy --workspace` and
# `cargo test --workspace`, while a path dependency outside one is compiled as a
# dependency and linted by nothing.
#
# Attic relics must never be listed here. A member's name and version land in
# Cargo.lock, which is tracked publicly.

[workspace]
resolver = "3"
members = [
    "crates/*",
    "docket",
    "ernest",
    "midden",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

# Every dependency two or more members share. A member's own dependencies stay
# in its own manifest — hoisting a single-consumer crate here would claim a
# shared version policy that does not exist.
[workspace.dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
camino = { version = "1.2.5", features = ["serde1"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
comfy-table = "8.0.0"
fs-err = "3.3.1"
getrandom = "0.4.3"
insta = { version = "1.48.0", features = ["glob", "json"] }
jiff = { version = "0.2.35", features = ["serde"] }
predicates = "3.1.4"
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
which = "8.0.0"

# Profiles are workspace-wide by construction: cargo ignores a member's own
# [profile] block. All three relics declared the same release profile anyway.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Full DWARF was 88% of this lane's disk (3.26 GB of 3.7 GB, almost all of it
# under target/debug from test and clippy runs). Line tables keep backtraces
# readable, which is the only thing debuginfo is for in a CLI relic.
[profile.dev]
debug = "line-tables-only"

# The typed-domain standard, enforced. See ~/.config/reliquary/HARDENING.md.
#
# One table over every member (`lints.workspace = true`), because per-crate
# attributes drift. It is also the *only* lint policy: `relic test` deliberately
# does not pass `-D warnings`, because a command-line group flag outranks every
# table entry and would collapse `warn` and `deny` into one level. Policy that
# lives in a committed file is policy you can ratchet; policy in an invocation
# flag is policy with one setting.
#
# A group carries a lower `priority` than the specific lints that override it.

# What `-D warnings` denied before the table existed. Unchanged in strength.
[workspace.lints.rust]
unsafe_code = "forbid"
deprecated = "deny"
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }

# The typed-domain worklist. `warn` now, `deny` at W3 exit once the retro-fit
# onto the platform layer has rewritten most of what fires. Landing a dozen
# lints hot buys a wall of failures and a matching wall of #[allow].
pedantic = { level = "warn", priority = -1 }

# Opaque representations stop at the I/O boundary.
as_conversions = "warn"
indexing_slicing = "warn"
string_slice = "warn"
str_to_string = "warn"

# A `_ =>` on our own enum is how a new variant gets silently mishandled.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"

# Two pedantic lints turned off in the one place that is a record rather than a
# scattering. A suppression per site would say the same thing twenty times, and
# say it where nobody reads policy.
#
# A dispatch table wants one signature, and `Result<()>` is that signature even
# on the arm that cannot fail.
unnecessary_wraps = "allow"
# Worth having on a library; noise on a binary whose `pub` only crosses modules.
# It rides a crate-root `#![warn]` in the platform crate instead, the way
# `missing_docs` does — `lints.workspace = true` admits no per-crate table entry.
must_use_candidate = "allow"

# Errors are values. Test carve-outs live in clippy.toml, never in a #![allow].
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
