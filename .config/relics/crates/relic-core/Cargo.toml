[package]
name = "relic-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The platform layer every relic builds on: capabilities, one meaning for a path, one output shape."
license.workspace = true
publish.workspace = true

[lib]
name = "relic_core"
path = "src/lib.rs"

# Judged, not counted: a platform crate reaches for a maintained ecosystem crate
# before writing one, and the counterweight is supply-chain hygiene rather than a
# budget. What does not belong here is a dependency pulled in for one relic's
# convenience — every relic that wants a project key pays for it.
[dependencies]
anstream.workspace = true
camino.workspace = true
clap.workspace = true
fs-err.workspace = true
jiff.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
which.workspace = true

# Properties the example-based tests can only sample: idempotence, monotonicity,
# and what a normal form leaves behind.
[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
