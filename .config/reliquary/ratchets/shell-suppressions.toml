# Inline `# shellcheck disable=` directives, counted per file.
#
# See "Track 3 — the verification ratchet" in ~/.config/reliquary/HARDENING.md,
# and the header of ~/.config/bin/check-shell-lint for why the accept mechanism
# is an inline directive rather than a central register of findings: provenance
# belongs beside the code, and a directive carries its reason at the site.
#
# This is the control over that mechanism. Silencing a finding makes the finding
# count fall, so nothing else can see it happen. An equality, not a ceiling —
# removing a directive means lowering the number in the same commit.
#
# Population: what `check-shell-lint` checks, so no `.md`, no `.rs`, no symlink
# and no fixture appears here.

".config/bin/check-bedrock" = 2
".config/bin/check-brew-health" = 2
".config/bin/up" = 1
".config/bin/yadm-wrapper" = 2
".config/relics/docket/scripts/update.sh" = 1
".config/relics/midden/scripts/update.sh" = 1
".config/relics/relic/src/relic.sh" = 2
".config/relics/relic/tests/run.sh" = 1
".config/reliquary/lib/relic.sh" = 3
".config/shell/env.d/040-env.sh" = 1
".config/shell/interactive.d/100-aliases.sh" = 2
".config/yadm/snippets/shared/12-publish-relics.sh" = 2
