# Inline `# shellcheck disable=` directives, counted per file.
#
# See "Track 3 — the verification ratchet" in ~/.config/reliquary/HARDENING.md,
# and `assay`'s `shell-lint` station for why the accept mechanism is an inline
# directive rather than a central register of findings: provenance belongs beside
# the code, and a directive carries its reason at the site.
#
# This is the control over that mechanism. Silencing a finding makes the finding
# count fall, so nothing else can see it happen. An equality, not a ceiling —
# removing a directive means lowering the number in the same commit.
#
# Population: what the `shell-lint` station checks, so no `.md`, no `.rs`, no
# symlink and no fixture appears here.

".config/bin/yadm-wrapper" = 1
".config/reliquary/lib/relic.sh" = 1
".config/shell/env.d/040-env.sh" = 1
".config/shell/interactive.d/100-aliases.sh" = 2
".config/yadm/snippets/shared/12-publish-relics.sh" = 2
